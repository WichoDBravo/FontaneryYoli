<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Fontanería</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 420px;
        }

        .register-card {
            background: white;
            padding: 48px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }

        .register-card .logo-icon {
            text-align: center;
            font-size: 48px;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .register-card h2 {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .register-card .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #334155;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-register:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
        }

        .error-message {
            color: #ef4444;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            display: none;
            padding: 10px;
            background: #fef2f2;
            border-radius: 8px;
        }

        .success-message {
            color: #10b981;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            display: none;
            padding: 10px;
            background: #ecfdf5;
            border-radius: 8px;
        }

        .login-link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #64748b;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <div class="logo-icon">
                <i class="fas fa-wrench"></i>
            </div>
            <h2>Crear Cuenta</h2>
            <p class="subtitle">Regístrate para administrar el inventario</p>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" required>
                </div>
                <button type="submit" class="btn-register">
                    <i class="fas fa-user-plus"></i>
                    Registrarse
                </button>
                <div class="error-message" id="errorMessage">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText">Error al registrarse</span>
                </div>
                <div class="success-message" id="successMessage">
                    <i class="fas fa-check-circle"></i>
                    <span>Registro exitoso! Redirigiendo...</span>
                </div>
            </form>
            
            <div class="login-link">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { 
            auth, 
            createUserWithEmailAndPassword,
            onAuthStateChanged
        } from './firebase-config.js';

        const registerForm = document.getElementById('registerForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const successMessage = document.getElementById('successMessage');

        // Si ya está autenticado, redirigir
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'index.html';
            }
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const confirmPassword = confirmPasswordInput.value.trim();

            // Validaciones
            if (!email || !password || !confirmPassword) {
                errorText.textContent = 'Completa todos los campos';
                errorMessage.style.display = 'block';
                return;
            }

            if (!email.includes('@')) {
                errorText.textContent = 'Ingresa un correo electrónico válido';
                errorMessage.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                errorText.textContent = 'La contraseña debe tener al menos 6 caracteres';
                errorMessage.style.display = 'block';
                return;
            }

            if (password !== confirmPassword) {
                errorText.textContent = 'Las contraseñas no coinciden';
                errorMessage.style.display = 'block';
                return;
            }

            try {
                // 🔐 Registrar usuario en Firebase
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                console.log("✅ Usuario registrado:", userCredential.user.email);
                
                successMessage.style.display = 'block';
                
                // Redirigir después de 2 segundos
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                console.error("❌ Error de registro:", error);
                
                let mensaje = 'Error al registrarse. Intenta de nuevo.';
                if (error.code === 'auth/email-already-in-use') {
                    mensaje = 'Este correo electrónico ya está registrado';
                } else if (error.code === 'auth/invalid-email') {
                    mensaje = 'Correo electrónico inválido';
                } else if (error.code === 'auth/weak-password') {
                    mensaje = 'La contraseña es muy débil. Usa al menos 6 caracteres';
                }
                
                errorText.textContent = mensaje;
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
