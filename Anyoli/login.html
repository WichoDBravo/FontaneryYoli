<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Fontanería</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--gray-50);
            padding: 20px;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            max-width: 400px;
            width: 100%;
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 8px;
            color: var(--gray-900);
        }
        .login-card p.subtitle {
            text-align: center;
            color: var(--gray-500);
            margin-bottom: 24px;
        }
        .login-card .form-group {
            margin-bottom: 16px;
        }
        .login-card label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--gray-700);
        }
        .login-card input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--gray-200);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        .login-card input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        .login-card .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            margin-top: 8px;
        }
        .login-card .btn-login:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.3);
        }
        .login-card .error-message {
            color: var(--danger);
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
        .login-card .logo-icon {
            text-align: center;
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-icon">
                <i class="fas fa-wrench"></i>
            </div>
            <h2>Gestión de Inventario</h2>
            <p class="subtitle">Inicia sesión para administrar productos</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i>
                    Iniciar Sesión
                </button>
                <div class="login-link">
                ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
                </div>
                <div class="error-message" id="errorMessage">Credenciales incorrectas</div>
            </form>
        </div>
    </div>

    <script type="module">
        import { 
            auth, 
            signInWithEmailAndPassword,
            onAuthStateChanged
        } from './firebase-config.js';

        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');

        // Si ya está autenticado, redirigir al panel
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'index.html';
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.style.display = 'none';

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                errorMessage.textContent = 'Completa todos los campos';
                errorMessage.style.display = 'block';
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error de login:', error);
                errorMessage.textContent = 'Correo o contraseña incorrectos';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
